<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="description" content="Spots"/><meta name="author" content="Costy Foglio"/><meta name="keywords" content="Spots"/><title>Spots</title><link rel="icon" href="favicon.ico"><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img id="header-logo" alt="Spots logo" class="header__logo"/></header><main class="content"><section class="profile page__section"><div class="profile__avatar-container"><button class="profile__avatar-button"><img src="d73f076c46eb5467f5fc.svg" alt="pencil-icon" class="profile__pencil-icon"/></button> <img src="04c411e519a1c6561568.jpg" alt="profile avatar" class="profile__avatar"/></div><div class="profile__column"><h1 class="profile__name">Bessie Coleman</h1><p class="profile__description">Civil Aviator</p><button aria-label="Edit Profile" type="button" class="profile__edit-button">Edit Profile</button></div><button type="button" aria-label="New Post" class="profile__add-button"><img class="profile__add-button-icon" src="40608da7369d39bc1077.svg" alt="plus icon"/>New Post</button></section><section class="cards page__section"><ul class="cards__list"><template id="card-template"><li class="card"><img class="card__image" src="" alt=""/><div class="card__content"><h2 class="card__title"></h2><button type="button" aria-label="like button" class="card__like-button"></button> <button class="card__delete-button"></button></div></li></template></ul></section></main><footer class="footer page__section"><p class="footer__name">2024 © Spots</p></footer><div class="modal" id="edit-modal"><div class="modal__container"><button type="button" class="modal__close-button"></button><h2 class="modal__title">Edit profile</h2><form name="edit-profile" class="modal__form" novalidate><label for="profile-name-input" class="modal__label">Name <input placeholder="Type your name" id="profile-name-input" class="modal__input" required minlength="2" maxlength="40"/> <span id="profile-name-input-error" class="modal__error"></span></label> <label for="profile-description-input" class="modal__label">Description <input placeholder="Describe yourself" id="profile-description-input" class="modal__input" required minlength="2" maxlength="200"/> <span id="profile-description-input-error" class="modal__error"></span></label> <button type="submit" class="modal__submit-button modal__submit-button_type_profile">Save</button></form></div></div><div class="modal" id="add-card-modal"><div class="modal__container"><button type="button" class="modal__close-button"></button><h2 class="modal__title">New post</h2><form name="add-card-modal" class="modal__form" id="add-card-modal" novalidate><label for="add-card-link-input" class="modal__label">Image link <input placeholder="Paste a link to the picture" id="add-card-link-input" type="url" class="modal__input" name="link" required/> <span id="add-card-link-input-error" class="modal__error"></span></label> <label for="add-card-name-input" class="modal__label">Caption <input placeholder="Type your caption" id="add-card-name-input" class="modal__input" name="name" required minlength="2" maxlength="30"/> <span id="add-card-name-input-error" class="modal__error"></span></label> <button type="submit" class="modal__submit-button">Save</button></form></div></div></div><div class="modal" id="preview-modal"><div class="modal__container modal__container_type_preview"><button aria-label="Close modal" type="button" class="modal__close-button modal__close-button_preview"></button> <img class="modal__image" src="" alt=""/><p class="modal__caption"></p></div></div><div class="modal" id="edit-avatar-modal"><div class="modal__container modal__container_type-avatar"><h2 class="modal__container-title modal__container-title_type-avatar">Edit profile Avatar</h2><form name="edit__profile-avatar" class="modal__form" id="edit-avatar-form" novalidate><label for="avatar-input" class="modal__label modal__label_type-avatar">Profile Picture <input id="avatar-input" type="url" name="avatar" placeholder="Paste the link to an image" class="modal__input modal__input_type-avatar" required/> <span id="avatar-input-error" class="modal__error"></span></label> <button type="button" class="modal__close-button modal__close-button_avatar" id="avatar-close-button"></button> <button type="submit" class="modal__submit-button modal__submit-button_type_avatar" id="avatar-submit-button">SAVE</button></form></div></div><div class="modal" id="delete-modal"><div class="modal__container modal__container_type_delete"><button aria-label="Close Modal" class="modal__close-button modal__delete-exit-button" type="button"></button><h3 class="modal__title modal__title_type_delete">Are you sure you want to delete this image?</h3><form class="modal__form" id="delete-form"><div class="modal__button-container"><button class="modal__submit-button modal__submit-button_type_delete" id="submit-delete-button" type="submit">Delete</button> <button class="modal__cancel-button" id="cancel-delete-button" type="button">Cancel</button></div></form></div></div></body></html>
